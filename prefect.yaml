name: data_end_to_end
prefect-version: 3.8.5

build: null
push: null

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /path/to/data_end_to_end # replace with this repo's absolute path on the deploying machine

deployments:
  - name: customer-bronze-to-gold
    version: null
    tags:
      - customer
      - bronze-to-gold
    description: Orchestrate customer data transformations from bronze through gold.
    entrypoint: prefect/flows/customer_flow/customer_flow.py:customer_data_pipeline
    parameters:
      bronze_input: s3a://data-bucket/bronze/input.csv
      silver_input_output: s3a://data-bucket/silver/customer_orders
      gold_output: s3a://data-bucket/gold/customer_orders
    work_pool:
      name: local_workpool
      work_queue_name: null
      job_variables: {}
    schedules:
      - cron: 0 2 * * *
        timezone: UTC
        day_or: true
        active: true